name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI
        # the example's packages are not installed here, so findings are expected; --fail-on never keeps the exit code 0
        run: |
          pyinstaller-doctor --version
          pyinstaller-doctor scan examples/demo_app/app.py --fail-on never
          pyinstaller-doctor scan examples/common_mistakes/app.py --json --fail-on never
